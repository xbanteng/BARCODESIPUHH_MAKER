<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generator Label Barcode</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mut:#6b6a65;--bd:#d9d7cf;--ac:#1f6f4a;--act:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#eeede8;--mut:#a09f98;--bd:#3a3a36;--ac:#4cae80;--act:#0d1a13}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#eeede8;--mut:#a09f98;--bd:#3a3a36;--ac:#4cae80;--act:#0d1a13}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}p.s{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input[type=file]{width:100%;font:inherit;color:var(--tx)}
button{background:var(--ac);color:var(--act);border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
small,.it{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main>
<h1>Generator Label Barcode</h1>
<p class="s">Unggah Excel berisi nomor barcode, lalu buka halaman hasil yang siap dicetak.</p>

<div class="card">
  <label>File Excel (.xlsx / .xls / .csv)</label>
  <input type="file" id="xl" accept=".xlsx,.xls,.csv">
  <small>Kolom A = nomor barcode. Kolom B (opsional) = teks perusahaan khusus untuk baris tersebut. Baris header dilewati otomatis.</small>
</div>

<div class="card">
  <div class="grid">
    <div><label>Teks perusahaan (default)</label><input type="text" id="co" value="PT Adaro Indonesia SK 1045"></div>
    <div><label>Ganti logo (opsional)</label><input type="file" id="logo" accept="image/*"></div>
  </div>
</div>

<div class="row">
  <button id="pr" disabled>Buka halaman hasil</button>
  <span id="cnt" class="it">Belum ada file.</span>
</div>
</main>

const $=id=>document.getElementById(id);

function drawQR(ctx,text,x,y,size){
  const q=qrcode(0,'M');q.addData(text);q.make();
  const n=q.getModuleCount(),c=size/n;
  ctx.fillStyle='#000';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)
    if(q.isDark(r,k))ctx.fillRect(Math.round(x+k*c),Math.round(y+r*c),Math.ceil(c),Math.ceil(c));
}
function render(code,company,s){
  s=s||1;
  const cv=document.createElement('canvas');cv.width=W*s;cv.height=H*s;
  const ctx=cv.getContext('2d');ctx.setTransform(s,0,0,s,0,0);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeRect(2,2,W-4,H-4);
  const lg=logoImg||(DEFAULT_LOGO.complete&&DEFAULT_LOGO.naturalWidth?DEFAULT_LOGO:null);
  if(lg)ctx.drawImage(lg,14,12,128,128);
  ctx.fillStyle='#000';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.font='bold 26px "Times New Roman",Times,serif';
  ctx.fillText('KEMENTERIAN KEHUTANAN',392,70);
  ctx.fillText('REPUBLIK INDONESIA',392,103);
  ctx.font='bold 22px "Times New Roman",Times,serif';
  ctx.fillText(company||$('co').value,324,174);
  drawQR(ctx,code,37,213,185);
  drawQR(ctx,code,255,235,135);
  drawQR(ctx,code,428,213,185);
  ctx.font='22px "Times New Roman",Times,serif';
  ctx.fillText(code,324,448);
  return cv;
}
function upd(){
  $('pr').disabled=!rows.length;
  $('cnt').textContent=rows.length?rows.length+' label siap.':'Tidak ada nomor barcode yang terbaca.';
}
$('xl').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellText:true,raw:true});
    const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
    rows=data.map(r=>({code:String(r[0]).trim(),co:String(r[1]||'').trim()}))
      .filter(r=>r.code&&/\d/.test(r.code));
    upd();
  }catch(err){alert('Gagal membaca file: '+err.message)}
};
$('logo').onchange=e=>{
  const f=e.target.files[0];if(!f){logoImg=null;return}
  const im=new Image();im.onload=()=>{logoImg=im};im.src=URL.createObjectURL(f);
};
$('pr').onclick=()=>{
  const body=rows.map(r=>'<div class="lbl"><img src="'+render(r.code,r.co,2).toDataURL('image/png')+'"></div>').join('');
  const html='<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Cetak Label ('+rows.length+')</title><style>'
   +'*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#000}'
   +'.bar{position:fixed;top:0;left:0;right:0;z-index:5;padding:8px 12px;background:#222;color:#fff;font:14px system-ui,sans-serif;display:flex;gap:12px;align-items:center;flex-wrap:wrap}'
   +'.bar button{padding:6px 16px;font:inherit}.bar input{width:56px;padding:4px;font:inherit}'
   +'body{padding-top:56px}.lbl img{width:3in;display:block;margin:0 auto}.lbl+.lbl{margin-top:1mm}'
   +'@media print{body{padding-top:0}.bar{display:none}.lbl{display:flex;align-items:center;justify-content:center;overflow:hidden;break-after:page;page-break-after:always}.lbl:last-child{break-after:auto;page-break-after:auto}.lbl img{width:100%;height:auto;max-height:100%;object-fit:contain;margin:0}.lbl+.lbl{margin-top:0}}'
   +'</style><style id="dyn"></style></head><body>'
   +'<div class="bar"><button onclick="print()">Cetak</button><span>Kertas (inci): <input id="w" value="3" oninput="ap()"> x <input id="h" value="3" oninput="ap()"></span>'
   +'<span>'+rows.length+' label. Di dialog cetak: pilih printer Zebra, margin None, skala 100%.</span></div>'
   +body
   +'<script>function ap(){var w=parseFloat(document.getElementById("w").value)||3,h=parseFloat(document.getElementById("h").value)||3;document.getElementById("dyn").textContent="@page{size:"+w+"in "+h+"in;margin:0}@media print{.lbl{width:"+w+"in;height:"+h+"in}}"}ap();<\/script>'
   +'</body></html>';
  const w=window.open('','_blank');
  if(w){w.document.write(html);w.document.close();}
  else{document.open();document.write(html);document.close();}
};
</script>
</body>
