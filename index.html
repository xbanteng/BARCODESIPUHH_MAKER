<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Label Barcode</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mut:#6b6a65;--bd:#d9d7cf;--ac:#1f6f4a;--act:#fff;--er:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--card:#222220;--tx:#eeede8;--mut:#a09f98;--bd:#3a3a36;--ac:#4cae80;--act:#0d1a13;--er:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;width:100%;max-width:380px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:var(--mut)}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:22px;letter-spacing:6px;text-align:center;margin-bottom:12px}
button{width:100%;background:var(--ac);color:var(--act);border:0;border-radius:8px;padding:10px;font:inherit;font-weight:600;cursor:pointer;margin-bottom:8px}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}
#msg{min-height:22px;font-size:14px;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <h1>Generator Label Barcode</h1>
  <p>Akses dilindungi kode OTP. Klik Minta kode, lalu masukkan kode 6 digit dari admin.</p>
  <button class="g" id="rq">Minta kode</button>
  <input id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
  <button id="go">Masuk</button>
  <div id="msg"></div>
</div>
<script>
const $=id=>document.getElementById(id);
function say(t,err){const m=$('msg');m.textContent=t;m.style.color=err?'var(--er)':'var(--mut)'}
async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return r;
}
$('rq').onclick=async()=>{
  $('rq').disabled=true;say('Mengirim permintaan...');
  try{
    const r=await post('/api/request-code',{});const j=await r.json();
    say(r.ok?'Kode dikirim ke admin. Berlaku 5 menit.':(j.error||'Gagal.'),!r.ok);
  }catch(e){say('Gagal terhubung ke server.',true)}
  setTimeout(()=>{$('rq').disabled=false},5000);
};
$('go').onclick=async()=>{
  const code=$('code').value.trim();
  if(code.length!==6){say('Masukkan 6 digit kode.',true);return}
  $('go').disabled=true;say('Memeriksa...');
  try{
    const r=await post('/api/verify-code',{code});const j=await r.json();
    if(!r.ok){say(j.error||'Gagal.',true);$('go').disabled=false;return}
    const a=await post('/api/app',{token:j.token});
    if(!a.ok){say(await a.text(),true);$('go').disabled=false;return}
    const html=await a.text();
    document.open();document.write(html);document.close();
  }catch(e){say('Gagal terhubung ke server.',true);$('go').disabled=false}
};
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
</script>
</body>
</html>
